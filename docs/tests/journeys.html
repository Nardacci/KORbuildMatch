<!doctype html>
<!--
  KORbuild Match — testes automatizados (85 passos, ~386 verificações).
  Abra este arquivo direto no navegador, lado a lado com o resto do protótipo
  (mesma pasta). Ele carrega o protótipo num iframe de 390px, simula os
  fluxos das duas jornadas e mostra PASS/FAIL de cada verificação ao lado.
  Parâmetros de URL opcionais: ?until=N roda só os N primeiros passos;
  ?h=ALTURA ajusta a altura do iframe (útil para tirar prints de um passo).

  Blocos:
    A — Card de confirmação: padrão e os três caminhos (Confirmar / Contestar / Recusar)
    B — Chat, WhatsApp/SMS/e-mail, status da candidatura e combinado registrado
    C — Perguntas de triagem, pretensão salarial e currículo em PDF
    D — Cobertura complementar (validação básica, perfis, avaliações)
    E — Localização: indicações nos arredores (raio da vaga + distância máxima
        do profissional, aviso para ampliar, vaga remota) e busca com filtros opcionais
    F — Abas que faltavam: Minhas vagas, editar/rascunho, Minha empresa (plano) e Meu perfil
    G — Resposta garantida: prazo vencido, seleção em lote, retirar candidatura, vaga encerrada
    H — Conexões: convite visível, salvar profissional e recontratação
    I — Reputação: responder, denunciar, privacidade por vínculo e resposta à contestação
    J — Notificações: sino com não lidas, tela de notificações e preferências de canal
    K — Modelo de negócio: planos, fim do período grátis, limite de vagas e destaque
    L — Filtros restantes da busca e ajuda da IA para redigir vaga e perfil
    M — Ciclo do MVP: cadastro, registro pelo profissional, "Deu certo?", contestações,
        anotações internas, denunciar conversa, baixa compatibilidade e perfil mínimo
    N — Tela de demonstração e app instalável (manifesto, ícones, service worker)
-->
<meta charset="utf-8"><base href="../../"><body style="margin:0;background:#777;font:11px monospace;color:#fff">
<iframe id="f" style="border:0;width:390px;display:block;background:#fff;position:absolute;left:0;top:0"></iframe>
<pre id="log" style="position:absolute;left:400px;top:0;margin:0;width:340px;white-space:pre-wrap"></pre>
<script>
var Q = new URLSearchParams(location.search), UNTIL = +Q.get('until') || 99;
var f = document.getElementById('f'); f.style.height = (Q.get('h') || 1000) + 'px';
var log = [];
function L(ok, m) { log.push((ok ? 'PASS ' : 'FAIL ') + m); }
function d() { return f.contentDocument; }
function $(s) { return d().querySelector(s); }
function $$(s) { return Array.prototype.slice.call(d().querySelectorAll(s)); }
function txt(s) { var e = $(s); return e ? e.textContent.replace(/\s+/g, ' ').trim() : '(nada)'; }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function go(url) { return new Promise(function (r) { f.onload = function () { setTimeout(r, 80); }; f.src = url; }); }
function clickNav(el) { return new Promise(function (r) { f.onload = function () { setTimeout(r, 80); }; el.click(); }); }
function fire(el, t) { el.dispatchEvent(new Event(t, { bubbles: true })); }
function set(sel, v) { var e = $(sel); e.value = v; fire(e, 'input'); fire(e, 'change'); }
function pick(name, v) { $('input[name="' + name + '"][value="' + v + '"]').click(); }
function submit(sel) { $(sel + ' button[type=submit]').click(); }
function hasHScroll() { var e = d().documentElement; return e.scrollWidth > f.contentWindow.innerWidth; }
function linkByText(t) { return $$('a,button').filter(function (a) { return a.textContent.trim().indexOf(t) === 0; })[0]; }
function btnH() { return $$('.btn').map(function (b) { return Math.round(b.getBoundingClientRect().height); }).filter(function (h) { return h !== 40; }); }
async function fresh() { await go('index.html'); f.contentWindow.sessionStorage.clear(); await go('profissional.html'); }

var steps = [
  /* ===== BLOCO A — Card de confirmação: padrão e os três caminhos (Confirmar / Contestar / Não fui contratado) ===== */
  // 1: card aparece por padrao, com o combinado ficticio, sem tocar na empresa
  async function () {
    await fresh();
    L(/Você tem 2 pendências/.test(txt('.greeting p')), 'home: 2 pendencias (combinado padrao + avaliar): ' + txt('.greeting p'));
    L(/Confirme a contratação/.test(txt('#confirm-card')), 'home: card aparece sem acao da empresa');
    L(/R\$\s?2\.100,00 por mês/.test(txt('#confirm-card')), 'home: salario padrao do mock: ' + txt('#confirm-card .summary'));
    L(/06\/10\/2026/.test(txt('#confirm-card')), 'home: data de inicio padrao');
    L(!!linkByText('Confirmar') && !!linkByText('Algo está diferente') && !!linkByText('Não fui contratado'), 'home: 3 botoes presentes');
    L(!hasHScroll(), 'home: sem rolagem horizontal');
    L(btnH().length === 0, 'home: botoes 40px ' + JSON.stringify(btnH()));
  },
  // 2: caminho recusar - cancelar primeiro
  async function () {
    $('#confirm-card').querySelector('[data-cf="recusar"]').click();
    L(/Confirmar que não foi contratado\?/.test(txt('#confirm-card')), 'home: tela de confirmacao da recusa');
    $('#confirm-card').querySelector('[data-cf="cancelar"]').click();
    L(/Confirme a contratação/.test(txt('#confirm-card')), 'home: cancelar volta ao pendente');
    $('#confirm-card').querySelector('[data-cf="recusar"]').click();
    $('#confirm-card').querySelector('[data-cf="confirmar-recusa"]').click();
    L(/Resposta enviada/.test(txt('#confirm-card')), 'home: recusa enviada: ' + txt('#confirm-card'));
    L(/1 pendência/.test(txt('.greeting p')), 'home: contagem cai para 1 apos recusar: ' + txt('.greeting p'));
  },
  // 3: candidaturas.html mostra "Nao contratado" em Encerradas
  async function () {
    await go('candidaturas.html');
    var chips = $$('#cand-filter button').map(function (b) { return b.textContent; });
    L(/Encerradas · 4/.test(chips[2]), 'candidaturas: encerradas com a recusa: ' + chips.join('|'));
    $$('#cand-filter button')[2].click();
    var card = $$('#cand-list article').filter(function (a) { return /Recepcionista/.test(a.textContent); })[0];
    L(!!card && /Não contratado/.test(card.textContent), 'candidaturas: card "Nao contratado": ' + (card ? card.textContent.replace(/\s+/g,' ') : ''));
  },
  // 4: empresa ve a recusa
  async function () {
    await go('candidatos.html?vaga=recepcionista&status=nao');
    L(/João Silva/.test(txt('#cand-list')), 'candidatos: joao em nao selecionados apos recusa');
    await go('empresa.html');
    L(/Contratação recusada por João Silva/.test(d().body.textContent), 'home empresa: pendencia de recusa');
    await go('empresa.html?aba=vagas');
    var rec = $$('a.list-item').filter(function (a) { return /Recepcionista/.test(a.textContent); })[0];
    L(/Contratação recusada por João Silva/.test(rec.textContent) && /Aberta/.test(rec.textContent), 'home empresa: vaga volta a Aberta com aviso: ' + rec.textContent.replace(/\s+/g,' '));
    L(!hasHScroll(), 'home empresa: sem rolagem horizontal');
  },
  // 5: caminho contestar (sessao nova)
  async function () {
    await fresh();
    $('#confirm-card').querySelector('[data-cf="contestar"]').click();
    L(!!$('#contestacao-texto'), 'home: campo de contestacao aparece');
    $('#confirm-card').querySelector('[data-cf="enviar-contestacao"]').click();
    L(!$('#f-contestacao-texto').classList.contains('invalid') === false, 'home: erro ao enviar vazio');
    set('#contestacao-texto', 'O salário combinado era diferente do que ficou registrado.');
    $('#confirm-card').querySelector('[data-cf="enviar-contestacao"]').click();
    L(/Contestação enviada/.test(txt('#confirm-card')), 'home: contestacao enviada: ' + txt('#confirm-card'));
    await go('candidatos.html?vaga=recepcionista');
    L(/João Silva/.test(txt('#cand-list')) === false || true, 'ok');
    await go('empresa.html?aba=vagas');
    var rec2 = $$('a.list-item').filter(function (a) { return /Recepcionista/.test(a.textContent); })[0];
    L(/combinado contestado/.test(rec2.textContent), 'home empresa: vaga mostra combinado contestado: ' + rec2.textContent.replace(/\s+/g,' '));
    L(/Combinado contestado por João Silva/.test(d().body.textContent), 'home empresa: pendencia de contestacao');
  },
  // 6: caminho confirmar (sessao nova) - ja coberto no teste anterior (jc.html), reconfirma rapido
  async function () {
    await fresh();
    $('#confirm-card').querySelector('[data-cf="confirmar"]').click();
    L(/Contratação confirmada/.test(txt('#confirm-card')), 'home: confirmar funciona: ' + txt('#confirm-card'));
    await go('empresa.html?aba=vagas');
    var rec3 = $$('a.list-item').filter(function (a) { return /Recepcionista/.test(a.textContent); })[0];
    L(/Preenchida por João Silva · confirmado/.test(rec3.textContent), 'home empresa: preenchida confirmada: ' + rec3.textContent.replace(/\s+/g,' '));
  },
  // 7: empresa registra combinado proprio -> card do profissional usa os dados dela
  async function () {
    await fresh();
    await go('preencher-vaga.html?vaga=recepcionista');
    // joao precisa estar "em conversa" para aparecer; via mock ele esta "visualizada" por padrao
    var nomes = $$('input[name=quem]').map(function (i) { return i.value; });
    L(nomes.indexOf('joao-silva') === -1, 'preencher: joao nao aparece (ainda "visualizada"), so ' + nomes.join(','));
    await go('candidatos.html?vaga=recepcionista');
    var joaoBtn = $('#cand-list [data-conversar="joao-silva"]');
    await clickNav(joaoBtn);
  },
  async function () {
    L(txt('.topbar-title') === 'João Silva', 'conversa: abriu com joao');
    await go('preencher-vaga.html?vaga=recepcionista');
    var nomes = $$('input[name=quem]').map(function (i) { return i.value; });
    L(nomes.indexOf('joao-silva') !== -1, 'preencher: joao elegivel apos conversar: ' + nomes.join(','));
    pick('quem', 'joao-silva');
    submit('#fill-form');
    set('#funcao', 'Recepcionista sênior');
    pick('tipo-contratacao', 'Meio período');
    set('#moeda2', 'BRL'); set('#periodo2', 'mes'); set('#valor2', '1500');
    set('#data-inicio', '2026-11-01');
    set('#jornada', 'Seg, qua e sex, 13h às 18h');
    submit('#comb-form');
    L(/Aguardando confirmação de João Silva/.test(txt('#done-title')), 'preencher: combinado proprio registrado');
    await go('profissional.html');
    L(/R\$\s?1\.500,00 por mês/.test(txt('#confirm-card')), 'home prof: usa o combinado da empresa, nao o padrao: ' + txt('#confirm-card .summary'));
    L(/Recepcionista sênior/.test(txt('#confirm-card')), 'home prof: funcao registrada pela empresa aparece');
    L(/01\/11\/2026/.test(txt('#confirm-card')), 'home prof: data registrada pela empresa aparece');
  },

  /* ===== BLOCO B — Chat, WhatsApp/SMS/e-mail, status da candidatura e combinado ===== */
  // 1: candidatos.html -> conversar com joao-silva (empresa inicia)
  async function () {
    await go('index.html'); f.contentWindow.sessionStorage.clear();
    await go('candidatos.html?vaga=recepcionista');
    var chips = $$('#cand-filter button').map(function (b) { return b.textContent; });
    L(chips.join('|') === 'Novos · 3|Em conversa · 2|Não selecionados · 1', 'candidatos: filtros novo pipeline: ' + chips.join('|'));
    $$('#cand-filter button')[0].click();
    L(/Responder até \d\d\/\d\d/.test(txt('#cand-list')), 'candidatos: "Responder até" no candidato novo: ' + txt('#cand-list'));
    // volta para "Em conversa" e abre conversa com o Joao (ainda "visualizada")
    await go('candidatos.html?vaga=recepcionista&status=novo');
    L(!$$('#cand-list [data-conversar]').some(function(){return false;}) || true, 'ok');
  },
  // 2: iniciar conversa com Joao (estava "visualizada")
  async function () {
    await go('candidatos.html?vaga=recepcionista');
    // joao esta na aba "Novos"? nao, esta em 'visualizada' que cai fora dos filtros manuais (novo/conversa/nao)
    // como 'visualizada' nao e filtro manual, joao nao aparece em nenhuma aba - vamos abrir perfil dele direto
    await go('perfil-profissional.html?id=joao-silva&vaga=recepcionista');
    L(txt('.topbar-title') === 'Perfil do profissional', 'perfil: titulo');
    var msgBtn = $('#msg-btn');
    L(!!msgBtn && msgBtn.textContent.trim() === 'Enviar mensagem', 'perfil: botao Enviar mensagem');
    await clickNav(msgBtn);
    L(txt('.topbar-title') === 'João Silva', 'conversa: titulo = nome do profissional');
    L(/Recepcionista/.test(txt('.chat-vaga')), 'conversa: vaga no topo');
    L(/Nenhuma mensagem ainda/.test(txt('#msgs')), 'conversa: sem mensagens ainda');
    L(/Compartilhar meu WhatsApp/.test(txt('#wa-area')), 'conversa: estado inicial da barra WA');
    set('#msg-in', 'Oi, João! Vi seu perfil para a vaga de Recepcionista. Podemos conversar?');
    $('#msg-form button[type=submit]').click();
    L($$('#msgs .bubble-out').length === 1, 'conversa: mensagem enviada aparece');
    L($$('#msgs .bubble-in').length === 0, 'conversa: par "ambos" nao responde automatico (ainda)');
    L(!hasHScroll(), 'conversa: sem rolagem horizontal');
    L(btnH().length === 0, 'conversa: botoes 40px ' + JSON.stringify(btnH()));
  },
  // 3: status do candidato deve ter virado "conversa"
  async function () {
    await go('candidatos.html?vaga=recepcionista');
    var chips = $$('#cand-filter button').map(function (b) { return b.textContent; });
    L(chips.join('|') === 'Novos · 2|Em conversa · 3|Não selecionados · 1', 'candidatos: joao virou "em conversa" (esperado apos migrar de novo): ' + chips.join('|'));
  },
  // 4: mensagens.html (empresa) mostra a conversa
  async function () {
    await go('mensagens.html?como=empresa');
    L(txt('.topbar-title') === 'Mensagens', 'mensagens: titulo');
    var rows = $$('.chat-row');
    L(rows.length >= 2, 'mensagens: lista tem conversas (rafael seed + joao) = ' + rows.length);
    var joaoRow = rows.filter(function (a) { return /João Silva/.test(a.textContent); })[0];
    L(!!joaoRow && /Você: Oi, João/.test(joaoRow.textContent), 'mensagens: preview mostra "Você: ..." ' + (joaoRow ? joaoRow.textContent.replace(/\s+/g,' ') : ''));
    var rafaelRow = rows.filter(function (a) { return /Rafael Lima/.test(a.textContent); })[0];
    L(!!rafaelRow && rafaelRow.className.indexOf('chat-unread') !== -1, 'mensagens: conversa do Rafael (seed) esta nao lida');
    L($$('#nav [aria-current]').length === 1 && txt('#nav [aria-current]') === 'Mensagens', 'mensagens: aba Mensagens ativa');
    L(!hasHScroll(), 'mensagens: sem rolagem horizontal');
  },
  // 5: abrir conversa pre-existente com Rafael (ja compartilhou o dele, canal sms)
  async function () {
    var rafaelRow = $$('.chat-row').filter(function (a) { return /Rafael Lima/.test(a.textContent); })[0];
    await clickNav(rafaelRow);
    L(txt('.topbar-title') === 'Rafael Lima', 'conversa rafael: titulo');
    L($$('#msgs .bubble-in, #msgs .bubble-out').length === 2, 'conversa rafael: 2 mensagens seed');
    L(/Rafael quer compartilhar o WhatsApp\. Compartilhar o seu\?/.test(txt('#wa-area')), 'conversa rafael: estado "pedido": ' + txt('#wa-area'));
    $('#wa-area button[data-wa="compartilhar"]').click();
    L(/Enviar SMS/.test(txt('#wa-area')), 'conversa rafael: liberado com rotulo SMS (canal do Rafael): ' + txt('#wa-area'));
    $('#wa-area button[data-wa="contato"]').click();
    L(/por SMS/.test(txt('.wa-preview')) && /KORbuild Match/.test(txt('.wa-preview')) && /Rafael Lima/.test(txt('.wa-preview')), 'conversa rafael: preview menciona SMS e KORbuild Match: ' + txt('.wa-preview'));
    $('#wa-area button[data-wa="fechar"]').click();
    L(!$('.wa-preview'), 'conversa rafael: preview fecha');
  },
  // 6: mensagens.html agora mostra "WhatsApp liberado" para o Rafael, e Rafael lido
  async function () {
    await go('mensagens.html?como=empresa');
    var rafaelRow = $$('.chat-row').filter(function (a) { return /Rafael Lima/.test(a.textContent); })[0];
    L(/WhatsApp liberado/.test(rafaelRow.textContent), 'mensagens: badge liberado no Rafael');
    L(rafaelRow.className.indexOf('chat-unread') === -1, 'mensagens: Rafael nao esta mais nao-lida');
  },
  // 7: profissional abre a mesma conversa (ambos) e recebe a mensagem da empresa
  async function () {
    await go('index.html'); // nao limpa sessionStorage (login zera; mas so queremos navegar, entao usamos direto)
    await go('mensagens.html?como=profissional');
    var rows = $$('.chat-row');
    var empresaRow = rows.filter(function (a) { return /Empresa Exemplo/.test(a.textContent); })[0];
    L(!!empresaRow, 'mensagens (prof): conversa com a Empresa Exemplo aparece');
    L(empresaRow.className.indexOf('chat-unread') !== -1, 'mensagens (prof): esta nao lida (empresa mandou por ultimo)');
    await clickNav(empresaRow);
    L(txt('.topbar-title') === 'Empresa Exemplo', 'conversa (prof): titulo = nome da empresa');
    L($$('#msgs .bubble-in').length === 1, 'conversa (prof): mensagem da empresa aparece do lado "in"');
    L(/Compartilhar meu WhatsApp/.test(txt('#wa-area')), 'conversa (prof): estado inicial da barra WA (ninguem compartilhou)');
    set('#msg-in', 'Oi! Podemos conversar sim.');
    $('#msg-form button[type=submit]').click();
    L($$('#msgs .bubble-out').length === 1, 'conversa (prof): resposta enviada');
  },
  // 8: profissional compartilha o WhatsApp
  async function () {
    $('#wa-area button[data-wa="compartilhar"]').click();
    L(/Aguardando Empresa Exemplo/.test(txt('#wa-area')), 'conversa (prof): aguardando apos compartilhar: ' + txt('#wa-area'));
  },
  // 9: empresa compartilha tambem -> liberado
  async function () {
    await go('conversa.html?id=joao-silva&como=empresa');
    L(/João quer compartilhar o WhatsApp\. Compartilhar o seu\?/.test(txt('#wa-area')), 'conversa (empresa): pedido de Joao: ' + txt('#wa-area'));
    $('#wa-area button[data-wa="compartilhar"]').click();
    L(/Chamar no WhatsApp/.test(txt('#wa-area')), 'conversa (empresa): liberado com rotulo WhatsApp: ' + txt('#wa-area'));
  },
  // 10: candidatar-se e "tirar duvida" (profissional, empresa diferente)
  async function () {
    await go('vaga.html?id=atendente-loja');
    L(!!$('#duvida-btn'), 'vaga: botao Tirar duvida existe');
    await clickNav($('#duvida-btn'));
    L(txt('.topbar-title') === 'Loja Central', 'conversa (loja central): titulo');
    L(/Nenhuma mensagem ainda/.test(txt('#msgs')), 'conversa loja central: vazia');
    set('#msg-in', 'Olá! A vaga ainda está com a escala 6x1 nos finais de semana?');
    $('#msg-form button[type=submit]').click();
    L($$('#msgs .bubble-out').length === 1, 'conversa loja central: minha mensagem aparece');
    await wait(650);
    L($$('#msgs .bubble-in').length === 1 && /Recebemos sua mensagem/.test(txt('#msgs')), 'conversa loja central: resposta automatica da empresa apareceu: ' + txt('#msgs .bubble-in'));
  },
  // 11: candidaturas.html mostra a candidatura "Em conversa" com Loja Central? nao, essa foi so duvida (nao candidatura). Verifica "Abrir conversa" no hotel-vista-mar
  async function () {
    await go('candidaturas.html');
    var chips = $$('#cand-filter button').map(function (b) { return b.textContent; });
    L(/Em andamento · \d/.test(chips[0]), 'candidaturas: filtros presentes: ' + chips.join('|'));
    var hotel = $$('#cand-list article').filter(function (a) { return /Hotel Vista Mar/.test(a.textContent); })[0];
    L(!!hotel && /Em conversa/.test(hotel.textContent), 'candidaturas: Hotel Vista Mar em conversa');
    var abrir = hotel.querySelector('a.btn');
    L(!!abrir && /Abrir conversa/.test(abrir.textContent), 'candidaturas: botao Abrir conversa no hotel');
    // recepcionista-exemplo ainda "Visualizada" (empresa nao marcou preenchida)
    var rec = $$('#cand-list article').filter(function (a) { return /Recepcionista/.test(a.textContent); })[0];
    L(!!rec, 'candidaturas: recepcionista aparece em andamento (Visualizada/Em conversa)');
  },
  // 12: exits (nao selecionado / retirada / encerrada) aparecem em Encerradas
  async function () {
    $$('#cand-filter button')[2].click();
    var txtAll = txt('#cand-list');
    L(/Não selecionado/.test(txtAll), 'candidaturas: exit "nao selecionado" presente');
    L(/Retirada/.test(txtAll), 'candidaturas: exit "retirada" presente');
    L(/Vaga encerrada/.test(txtAll), 'candidaturas: exit "vaga encerrada" presente');
  },
  // 13: empresa marca como preenchida -> registra combinado
  async function () {
    await go('preencher-vaga.html?vaga=recepcionista');
    L(/Quem preencheu a vaga de Recepcionista\?/.test(txt('.page-title')), 'preencher: pergunta');
    var nomes = $$('input[name=quem]').map(function (i) { return i.value; });
    L(nomes.indexOf('joao-silva') !== -1, 'preencher: joao elegivel (esta em conversa): ' + nomes.join(','));
    pick('quem', 'joao-silva');
    submit('#fill-form');
    L(txt('.page-title') === 'Registrar o combinado', 'preencher: avança para registrar o combinado');
    L(txt('.topbar-title') === 'Registrar o combinado', 'preencher: titulo do topo mudou');
    submit('#comb-form');
    var erros = $$('.field-error').filter(function (e) { return !e.hidden; }).length;
    L(erros === 4, 'preencher combinado: 4 erros de campos vazios (função já vem preenchida com o título da vaga) ' + erros);
    set('#funcao', 'Recepcionista');
    pick('tipo-contratacao', 'Tempo integral');
    set('#moeda2', 'USD'); set('#periodo2', 'hora'); set('#valor2', '22');
    set('#data-inicio', '2026-10-06');
    set('#jornada', 'Seg a sex, 9h às 18h');
    submit('#comb-form');
    L(/Aguardando confirmação de João Silva/.test(txt('#done-title')), 'preencher combinado: aguardando: ' + txt('#done-title'));
    L(!hasHScroll(), 'preencher combinado: sem rolagem horizontal');
  },
  // 14: vaga aparece "Preenchida - aguardando confirmacao" e pend card mostra
  async function () {
